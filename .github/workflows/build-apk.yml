name: Build WarungKu APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Create dummy webDir (required by Capacitor even in server URL mode)
        run: mkdir -p out

      - name: Remove incomplete Android folder & re-generate
        run: |
          rm -rf android
          npx cap add android

      - name: Copy custom icons
        run: |
          cp -r icons/mipmap-hdpi android/app/src/main/res/mipmap-hdpi
          cp -r icons/mipmap-mdpi android/app/src/main/res/mipmap-mdpi
          cp -r icons/mipmap-xhdpi android/app/src/main/res/mipmap-xhdpi
          cp -r icons/mipmap-xxhdpi android/app/src/main/res/mipmap-xxhdpi
          cp -r icons/mipmap-xxxhdpi android/app/src/main/res/mipmap-xxxhdpi

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.keystore

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: warungku-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
