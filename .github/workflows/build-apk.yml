name: Build WarungKu APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create dummy webDir
        run: mkdir -p out

      - name: Remove incomplete Android folder & re-generate
        run: |
          rm -rf android || true
          npx cap add android

      - name: Inject Android Permissions into AndroidManifest.xml
        run: python3 scripts/inject-permissions.py

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Copy custom icons
        run: |
          cp -f icons/mipmap-hdpi/*     android/app/src/main/res/mipmap-hdpi/     || true
          cp -f icons/mipmap-mdpi/*     android/app/src/main/res/mipmap-mdpi/     || true
          cp -f icons/mipmap-xhdpi/*    android/app/src/main/res/mipmap-xhdpi/    || true
          cp -f icons/mipmap-xxhdpi/*   android/app/src/main/res/mipmap-xxhdpi/   || true
          cp -f icons/mipmap-xxxhdpi/*  android/app/src/main/res/mipmap-xxxhdpi/  || true

      - name: Setup Keystore
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.keystore
            echo "STORE_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASS=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "Keystore decoded from secret"
          else
            keytool -genkeypair -v \
              -keystore android/app/my-release-key.keystore \
              -storepass android -keypass android -alias actionkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=ID"
            echo "STORE_PASS=android" >> $GITHUB_ENV
            echo "ALIAS=actionkey" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
            echo "Temporary keystore created"
          fi

      # ── TEMPORARY: untuk ambil SHA-1, hapus step ini setelah dapat SHA-1 ──
      - name: Print SHA-1 Fingerprint
        run: |
          echo "======= SHA-1 FINGERPRINT ======="
          keytool -keystore android/app/my-release-key.keystore \
            -list -v -alias $ALIAS -storepass $STORE_PASS \
            | grep "SHA1:"
          echo "================================="

      - name: Clear Gradle caches
        run: |
          rm -rf ~/.gradle/caches/ || true
          rm -rf ~/.gradle/wrapper/ || true
          rm -rf android/.gradle/ || true

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          STORE_FILE="$(pwd)/app/my-release-key.keystore"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" \
            --no-daemon \
            --no-build-cache \
            --refresh-dependencies

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: warungku-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
