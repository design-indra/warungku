name: Build WarungKu APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Create dummy webDir
        run: mkdir -p out

      - name: Remove incomplete Android folder & re-generate
        run: |
          rm -rf android
          npx cap add android

      - name: Inject Android Permissions into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$MANIFEST"

      - name: Patch MainActivity - Camera + Bluetooth
        run: |
          MAIN="android/app/src/main/java/com/warungku/app/MainActivity.java"
          mkdir -p "$(dirname "$MAIN")"
          printf '%s\n' \
            'package com.warungku.app;' \
            'import android.Manifest;' \
            'import android.content.pm.PackageManager;' \
            'import android.os.Bundle;' \
            'import android.webkit.PermissionRequest;' \
            'import androidx.core.app.ActivityCompat;' \
            'import androidx.core.content.ContextCompat;' \
            'import com.getcapacitor.BridgeActivity;' \
            'import com.getcapacitor.BridgeWebChromeClient;' \
            'public class MainActivity extends BridgeActivity {' \
            '  @Override' \
            '  public void onCreate(Bundle savedInstanceState) {' \
            '    super.onCreate(savedInstanceState);' \
            '    getBridge().setWebChromeClient(new BridgeWebChromeClient(getBridge()) {' \
            '      @Override' \
            '      public void onPermissionRequest(final PermissionRequest request) {' \
            '        String[] resources = request.getResources();' \
            '        boolean needCamera = false;' \
            '        for (String r : resources) {' \
            '          if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r) ||' \
            '              PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) {' \
            '            needCamera = true;' \
            '            break;' \
            '          }' \
            '        }' \
            '        if (needCamera) {' \
            '          if (ContextCompat.checkSelfPermission(MainActivity.this,' \
            '              Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {' \
            '            request.grant(resources);' \
            '          } else {' \
            '            ActivityCompat.requestPermissions(MainActivity.this,' \
            '                new String[]{Manifest.permission.CAMERA}, 100);' \
            '            request.grant(resources);' \
            '          }' \
            '        } else {' \
            '          super.onPermissionRequest(request);' \
            '        }' \
            '      }' \
            '    });' \
            '  }' \
            '}' \
            > "$MAIN"

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Copy custom icons
        run: |
          cp -f icons/mipmap-hdpi/* android/app/src/main/res/mipmap-hdpi/ || true
          cp -f icons/mipmap-mdpi/* android/app/src/main/res/mipmap-mdpi/ || true
          cp -f icons/mipmap-xhdpi/* android/app/src/main/res/mipmap-xhdpi/ || true
          cp -f icons/mipmap-xxhdpi/* android/app/src/main/res/mipmap-xxhdpi/ || true
          cp -f icons/mipmap-xxxhdpi/* android/app/src/main/res/mipmap-xxxhdpi/ || true

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/my-release-key.keystore

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: warungku-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
