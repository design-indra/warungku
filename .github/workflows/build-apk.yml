name: Build WarungKu APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      # Pastikan @capacitor/camera dan bluetooth-serial ikut terinstall
      - name: Install Capacitor Plugins (jika belum ada di package.json)
        run: |
          if ! grep -q "@capacitor/camera" package.json; then
            npm install @capacitor/camera@^6.0.0 --no-save
          fi
          if ! grep -q "@e-is/capacitor-bluetooth-serial" package.json; then
            npm install @e-is/capacitor-bluetooth-serial@^6.0.0 --no-save
          fi

      - name: Create dummy webDir
        run: mkdir -p out

      - name: Remove incomplete Android folder & re-generate
        run: |
          rm -rf android || true
          npx cap add android

      - name: Inject Android Permissions into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            perl -0777 -pe '
              s|<application|
                # Kamera
                    <uses-permission android:name="android.permission.CAMERA" />\n
                    <uses-feature android:name="android.hardware.camera" android:required="false" />\n
                    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n
                    # Bluetooth Classic (untuk printer thermal)\n
                    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n
                    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n
                    # Bluetooth untuk Android 12+ (API 31+)\n
                    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n
                    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n
                    <uses-feature android:name="android.hardware.bluetooth" android:required="false" />\n
                    <application|gx
            ' -i "$MANIFEST"

            # Hapus baris komentar (perl tidak bisa comment di string replacement, bersihkan manual)
            sed -i '/^[[:space:]]*# /d' "$MANIFEST"

            echo "=== AndroidManifest.xml (bagian permissions) ==="
            grep -A 15 "<uses-permission" "$MANIFEST" | head -20
          else
            echo "Warning: $MANIFEST not found"
          fi

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Copy custom icons
        run: |
          cp -f icons/mipmap-hdpi/*     android/app/src/main/res/mipmap-hdpi/     || true
          cp -f icons/mipmap-mdpi/*     android/app/src/main/res/mipmap-mdpi/     || true
          cp -f icons/mipmap-xhdpi/*    android/app/src/main/res/mipmap-xhdpi/    || true
          cp -f icons/mipmap-xxhdpi/*   android/app/src/main/res/mipmap-xxhdpi/   || true
          cp -f icons/mipmap-xxxhdpi/*  android/app/src/main/res/mipmap-xxxhdpi/  || true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/my-release-key.keystore
            echo "Keystore decoded"
          else
            echo "Error: KEYSTORE_BASE64 secret is empty"
            exit 1
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: warungku-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
